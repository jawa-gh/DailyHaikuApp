<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Android notification small-icon. Must be a white silhouette on a fully
       transparent background — Android 5+ strips colour and tints the icon
       using the `color` field from the expo-notifications plugin config.
       Stroke is bumped vs the app icon so the feather still reads at 24dp. -->
  <g transform="translate(20 20) scale(2.33)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
    <line x1="16" x2="2" y1="8" y2="22"/>
    <line x1="17.5" x2="9" y1="15" y2="15"/>
  </g>
</svg>
